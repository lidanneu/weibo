name: 微博博主发文监控

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 启动 RSSHub
        run: |
          docker run -d --name rsshub -p 1200:1200 diygod/rsshub:latest
          echo "等待 RSSHub 启动..."
          timeout 90 bash -c 'until curl -sf http://localhost:1200/ > /dev/null 2>&1; do echo "  RSSHub 还在启动中..."; sleep 3; done'
          echo "RSSHub 已就绪!"

      - name: 抓取微博博文
        run: |
          export TZ=Asia/Shanghai
          python scripts/weibo_monitor.py

      - name: 提交并推送
        run: |
          TZ=Asia/Shanghai
          git config user.name "weibo-monitor-bot"
          git config user.email "weibo-monitor-bot@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "没有新博文，跳过提交"
          else
            git commit -m "auto: weibo-monitor update [$(date '+%Y-%m-%d %H:%M')]"
            git push origin main
          fi
